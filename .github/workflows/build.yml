name: Build and test

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Nix build and Paper smoke test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Smoke test Paper
        run: nix run .#smoke

      - name: Prepare release jar
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          nix develop .#default --command gradle clean build -PyrushVersion="$release_version"
          mkdir -p build/release
          cp build/libs/*.jar build/release/YRush.jar

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nix develop .#default --command gh release create "$GITHUB_REF_NAME" build/release/YRush.jar \
            --verify-tag \
            --title "YRush $GITHUB_REF_NAME" \
            --generate-notes
